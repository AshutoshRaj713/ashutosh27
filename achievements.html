<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achievements Uploading</title>

<style>
/* Mobile First */
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #e9f0ff, #f9fbff);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.container {
  width: 100%;
  max-width: 360px;
  background: #ffffff;
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
}

.container h1 {
  font-size: 20px;
  color: #1f2933;
  margin-bottom: 8px;
}

.container h1 span {
  color: #2563eb;
}

.container p {
  font-size: 14px;
  color: #4b5563;
  line-height: 1.6;
  margin: 8px 0;
}

/* Loader */
.loader {
  width: 44px;
  height: 44px;
  margin: 18px auto;
  border: 4px solid #e5e7eb;
  border-top: 4px solid #2563eb;
  border-radius: 50%;
  animation: rotate 1s linear infinite;
}

@keyframes rotate {
  100% { transform: rotate(360deg); }
}

.note {
  font-size: 13px;
  color: #6b7280;
  margin-top: 12px;
}
</style>
</head>

<body>

<div class="container">
  <h1><span>Achievements</span> Update</h1>

  <p>
    We are currently preparing and uploading the latest achievements for you.
  </p>

  <p>
    Please stay connected and give us a little time to make sure everything is
    updated accurately.
  </p>

  <div class="loader"></div>

  <p class="note">
    Thank you for your patience and continued support.
  </p>
</div>

</body>
</html>
