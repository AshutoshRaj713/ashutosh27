<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proof Upload Pending</title>

<style>
/* Mobile First Design */
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #fff7ed, #fff);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.container {
  width: 100%;
  max-width: 360px;
  background: #ffffff;
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
}

.container h1 {
  font-size: 20px;
  color: #111827;
  margin-bottom: 8px;
}

.container h1 span {
  color: #f97316;
}

.container p {
  font-size: 14px;
  color: #4b5563;
  line-height: 1.6;
  margin: 8px 0;
}

/* Icon style */
.icon {
  font-size: 40px;
  margin: 10px 0;
}

/* Loader */
.loader {
  width: 40px;
  height: 40px;
  margin: 18px auto;
  border: 4px solid #fde68a;
  border-top: 4px solid #f97316;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

.note {
  font-size: 13px;
  color: #6b7280;
  margin-top: 12px;
}
</style>
</head>

<body>

<div class="container">
  <div class="icon">📄</div>

  <h1><span>Proof</span> Upload Pending</h1>

  <p>
    The required proof is currently being prepared and verified.
  </p>

  <p>
    It will be uploaded here very soon. Please check back after some time.
  </p>

  <div class="loader"></div>

  <p class="note">
    Thank you for your understanding and patience.
  </p>
</div>

</body>
</html>
